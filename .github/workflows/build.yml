name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64,   triplet: x64-windows-static, file: wfx_iOS.wfx64 }
          - { arch: x86, platform: Win32, triplet: x86-windows-static, file: wfx_iOS.wfx }
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare vcpkg cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A ${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        run: cmake --build build --config Release
      - name: Show exports
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          dumpbin /exports build\Release\${{ matrix.file }}
          dumpbin /dependents build\Release\${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: wfx_iOS-${{ matrix.arch }}
          path: build/Release/${{ matrix.file }}
          if-no-files-found: error
      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: |
            build/vcpkg-manifest-install.log
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/*/*.log

  installer:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build setup program (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\bin | Out-Null
          Copy-Item artifacts\wfx_iOS-x64\wfx_iOS.wfx64, artifacts\wfx_iOS-x86\wfx_iOS.wfx installer\bin\
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Get-Content version.txt -TotalCount 1).Trim()
          & $iscc "/DAppVer=$ver" installer\wfx_iOS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "installer\out\wfx_iOS_${ver}_setup.exe" installer\out\wfx_iOS_setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: wfx_iOS-setup
          path: installer/out/wfx_iOS_setup.exe
          if-no-files-found: error

  package:
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble plugin zip
        run: |
          VER=$(head -n1 version.txt | tr -d '[:space:]')
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir dist
          cp artifacts/wfx_iOS-x64/wfx_iOS.wfx64 artifacts/wfx_iOS-x86/wfx_iOS.wfx pluginst.inf readme.txt LICENSE version.txt dist/
          (cd dist && zip -9 "../wfx_iOS_${VER}.zip" wfx_iOS.wfx64 wfx_iOS.wfx pluginst.inf readme.txt LICENSE)
          cp artifacts/wfx_iOS-setup/wfx_iOS_setup.exe "dist/wfx_iOS_${VER}_setup.exe"
          cp "wfx_iOS_${VER}.zip" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wfx_iOS-package
          path: |
            dist/wfx_iOS_*.zip
            dist/wfx_iOS_*_setup.exe
      - name: Publish latest build to the dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "dist/wfx_iOS_${VER}.zip" "dist/wfx_iOS_${VER}_setup.exe" $PRE --title "wfx_iOS ${GITHUB_REF_NAME#v}" \
            --notes "Update of wfx_iOS 1.3 by Domo (original author) for modern iOS. Built by GitHub Actions with MSVC for x86 and x64. Beta: not yet verified on a device - please report results."
