name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64,   triplet: x64-windows-static, file: wfx_iOS.wfx64 }
          - { arch: x86, platform: Win32, triplet: x86-windows-static, file: wfx_iOS.wfx }
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare vcpkg cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A ${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        run: cmake --build build --config Release
      - name: Show exports
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          dumpbin /exports build\Release\${{ matrix.file }}
          dumpbin /dependents build\Release\${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: wfx_iOS-${{ matrix.arch }}
          path: build/Release/${{ matrix.file }}
          if-no-files-found: error
      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: |
            build/vcpkg-manifest-install.log
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees/*/*.log

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble plugin zip
        run: |
          mkdir dist
          cp artifacts/wfx_iOS-x64/wfx_iOS.wfx64 artifacts/wfx_iOS-x86/wfx_iOS.wfx pluginst.inf readme.txt LICENSE dist/
          cd dist && zip -9 ../wfx_iOS_2.0.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: wfx_iOS_2.0
          path: wfx_iOS_2.0.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wfx_iOS_2.0.zip --title "wfx_iOS ${GITHUB_REF_NAME#v}" --generate-notes
